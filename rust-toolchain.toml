[toolchain]
# Use stable Rust for development
channel = "stable"

# Components needed for development
components = ["rustfmt", "clippy", "rust-src"]

# Target platforms for cross-compilation
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc", 
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown"
]

# Profile settings for optimized builds
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = true
lto = true
codegen-units = 1
