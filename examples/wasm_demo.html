<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Recog WASM Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .results {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .match-item {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .match-description {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .match-params {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #666;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Recog WASM Demo</h1>
        <p class="subtitle">Server banner fingerprinting in your browser</p>
        
        <div>
            <label for="banner">Enter Server Banner:</label>
            <textarea id="banner" placeholder="Server: Apache/2.4.41 (Unix)">Server: Apache/2.4.41</textarea>
            <button onclick="matchBanner()">Match Fingerprint</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script type="module">
        // This would be the compiled WASM module
        // Build with: wasm-pack build --target web
        
        import init, { WasmRecog } from './pkg/recog.js';

        let matcher;

        async function initialize() {
            await init();
            
            const xml = `
                <fingerprints>
                    <fingerprint pattern="^Apache/([\\d.]+)" description="Apache HTTP Server">
                        <param pos="1" name="version"/>
                    </fingerprint>
                    <fingerprint pattern="^nginx/([\\d.]+)" description="Nginx">
                        <param pos="1" name="version"/>
                    </fingerprint>
                    <fingerprint pattern="^Microsoft-IIS/([\\d.]+)" description="Microsoft IIS">
                        <param pos="1" name="version"/>
                    </fingerprint>
                </fingerprints>
            `;
            
            matcher = new WasmRecog(xml);
            console.log('Recog WASM initialized!');
        }

        window.matchBanner = function() {
            const banner = document.getElementById('banner').value;
            const resultsDiv = document.getElementById('results');
            
            try {
                const results = matcher.match_text(banner);
                
                if (results.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="results">
                            <p>No matches found for this banner.</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '<div class="results"><h3>Matches:</h3>';
                for (const result of results) {
                    const params = JSON.parse(result.params);
                    html += `
                        <div class="match-item">
                            <div class="match-description">${result.description}</div>
                            <div class="match-params">Parameters: ${JSON.stringify(params, null, 2)}</div>
                        </div>
                    `;
                }
                html += '</div>';
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">Error: ${error.message}</div>
                `;
            }
        };

        // Initialize on page load
        initialize().catch(err => {
            console.error('Failed to initialize:', err);
            document.getElementById('results').innerHTML = `
                <div class="error">Failed to initialize WASM module. Make sure to build with wasm-pack first!</div>
            `;
        });
    </script>
</body>
</html>
